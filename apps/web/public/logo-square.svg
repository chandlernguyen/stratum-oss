<svg width="180" height="180" viewBox="0 0 180 180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Square logo for OAuth consent screens -->

  <!-- Background gradient circle (centered) -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#64748B"/>
      <stop offset="50%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
  </defs>

  <!-- Circular icon background -->
  <circle cx="90" cy="70" r="35" fill="url(#bgGradient)"/>

  <!-- Ŧ symbol in white -->
  <text x="90" y="70"
        dominant-baseline="middle"
        text-anchor="middle"
        font-family="Inter, system-ui, sans-serif"
        font-size="40"
        font-weight="700"
        fill="white">Ŧ</text>

  <!-- STRAŦUM wordmark below -->
  <text x="90" y="130"
        text-anchor="middle"
        font-family="Inter, system-ui, sans-serif"
        font-size="24"
        font-weight="700"
        letter-spacing="-0.02em">
    <tspan fill="#64748B">STRA</tspan>
    <tspan fill="#F59E0B">Ŧ</tspan>
    <tspan fill="#64748B">UM</tspan>
  </text>

  <!-- Tagline below -->
  <text x="90" y="150"
        text-anchor="middle"
        font-family="Inter, system-ui, sans-serif"
        font-size="8"
        font-weight="500"
        letter-spacing="0.1em"
        fill="#94A3B8">
    INTELLIGENCE OVER EXECUTION
  </text>
</svg>
