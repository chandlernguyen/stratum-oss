version: 2

updates:
  # CI actions go stale silently: a deprecated runtime shows up as a warning
  # that everyone learns to ignore until the action stops working.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"

  # npm and Poetry are deliberately left out. The repository is frozen (see
  # AGENTS.md) and CI is disabled, so routine version PRs would arrive untested.
  # Package security is handled from Dependabot alerts instead: the maintainer
  # reviews them monthly and lands narrow, locally tested fixes.
